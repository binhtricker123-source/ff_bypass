name: Build Dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: brew install ldid dpkg
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH
    - name: Create Makefile
      run: |
        cat <<EOF > Makefile
        ARCHS = arm64 arm64e
        TARGET = iphone:clang:latest:14.0
        include \$(THEOS)/makefiles/common.mk
        TWEAK_NAME = FF_Bypass
        FF_Bypass_FILES = Tweak.xm
        FF_Bypass_CFLAGS = -fobjc-arc
        include \$(THEOS)/makefiles/tweak.mk
        EOF
    - name: Build Tweak
      run: make package FINALPACKAGE=1
    - name: Locate and Copy Dylib
      run: |
        find . -name "*.dylib" -exec cp {} ./FF_Bypass.dylib \;
    - name: Upload Dylib
      uses: actions/upload-artifact@v4
      with:
        name: FF_Bypass_Dylib
        path: ./FF_Bypass.dylib
