name: Build Dylib
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Dependencies
      run: brew install ldid dpkg
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH
    - name: Create Makefile
      run: |
        echo 'ARCHS = arm64 arm64e' > Makefile
        echo 'TARGET = iphone:clang:latest:14.0' >> Makefile
        echo 'include $(THEOS)/makefiles/common.mk' >> Makefile
        echo 'TWEAK_NAME = FF_Bypass' >> Makefile
        echo 'FF_Bypass_FILES = Tweak.xm' >> Makefile
        echo 'FF_Bypass_CFLAGS = -fobjc-arc -Wno-error=deprecated-declarations' >> Makefile
        echo 'include $(THEOS)/makefiles/tweak.mk' >> Makefile
    - name: Build Tweak Only (No Package)
      run: make
    - name: Locate and Copy Dylib
      run: |
        find . -name "FF_Bypass.dylib" -exec cp {} ./FF_Bypass_Final.dylib \;
    - name: Upload Dylib
      uses: actions/upload-artifact@v4
      with:
        name: FF_Bypass_Dylib
        path: ./FF_Bypass_Final.dylib
